plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moon.audiopausetimer'
    compileSdk 36

    defaultConfig {
        applicationId "com.moon.audiopausetimer"
        minSdk 24
        // 刻意停在 32：Android 13 起，targetSdk ≥ 33 的应用调用 BluetoothAdapter.enable()/disable()
        // 一律返回 false，「到点关蓝牙 / 再自动开蓝牙」就做不到了。
        // 本应用是侧载安装，不需要满足 Play 的 targetSdk 要求。
        targetSdk 32
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // targetSdk 刻意停在 32（见上），Play 商店的上架要求对侧载安装没有意义
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // 解决 Kotlin stdlib 版本冲突（jdk7/jdk8 模块自 1.8.x 起已并入主 stdlib）
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib-jdk7 is part of kotlin-stdlib since 1.8.x'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib-jdk8 is part of kotlin-stdlib since 1.8.x'
        }
    }
}
