plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moon.audiopausetimer'
    compileSdk 34

    defaultConfig {
        applicationId "com.moon.audiopausetimer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // 解决 Kotlin stdlib 版本冲突（jdk7/jdk8 模块自 1.8.x 起已并入主 stdlib）
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib-jdk7 is part of kotlin-stdlib since 1.8.x'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib-jdk8 is part of kotlin-stdlib since 1.8.x'
        }
    }
}
